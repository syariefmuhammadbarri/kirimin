[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm-error.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log

[program:cron]
; runs the crontab entry registered at build time (php artisan schedule:run every minute)
command=cron -f
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/cron.log
stderr_logfile=/var/log/supervisor/cron-error.log

; Uncomment this if you start using queued jobs (ShouldQueue) later.
; [program:laravel-queue]
; command=php /var/www/artisan queue:work --tries=3 --timeout=90
; process_name=%(program_name)s_%(process_num)02d
; numprocs=1
